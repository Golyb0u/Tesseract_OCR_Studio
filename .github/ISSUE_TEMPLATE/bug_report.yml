name: Bug report
description: Report a reproducible problem with Tesseract OCR Studio
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in the details below.
        For OCR quality issues, attach the input image and the profile JSON if possible.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "2.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true
  - type: input
    id: tesseract
    attributes:
      label: Tesseract version
      description: Output of `tesseract --version`
      placeholder: "tesseract 5.5.0"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste the activity log or attach screenshots.
