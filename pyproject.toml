[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tesseract-ocr-studio"
version = "2.1.0"
description = "PyQt5 OCR workbench for Tesseract with a bilingual RU/EN interface"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Golyb0u" }]
keywords = ["ocr", "tesseract", "pyqt5", "desktop", "screenshot", "windows"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "PyQt5>=5.15",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pytesseract>=0.3.10",
    "mss>=9.0",
]

[project.urls]
Homepage = "https://github.com/Golyb0u/Tesseract_OCR_Studio"
Repository = "https://github.com/Golyb0u/Tesseract_OCR_Studio.git"
Issues = "https://github.com/Golyb0u/Tesseract_OCR_Studio/issues"
Changelog = "https://github.com/Golyb0u/Tesseract_OCR_Studio/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tesseract-ocr-studio = "tesseract_studio.app:main"

[project.gui-scripts]
tesseract-ocr-studio-gui = "tesseract_studio.app:main"

[tool.setuptools.packages.find]
include = ["tesseract_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
